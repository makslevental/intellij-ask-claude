# Builds the plugin on every push to main, the same way as locally: the plain-Java tests, then
# scripts/build-local.sh against a pinned CLion. The built plugin is published to the rolling "latest" release,
# which is replaced each time, and also attached to the run as an artifact.
name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write # to replace the release

# One run at a time, so two pushes cannot interleave deleting and recreating the release.
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The IDE to compile against. To update: take the version from the CLion download page and the hash from
      # https://download.jetbrains.com/cpp/CLion-<version>.tar.gz.sha256
      CLION_VERSION: 2026.2.3.1
      CLION_SHA256: 8db6133c8ac63b8e492e5401f0f32026a9cdf698787f8578d20339c05e73c7c3
    steps:
      - uses: actions/checkout@v7

      # The scripts build against IDE_HOME. (The runner context is not available in the job's env, hence a step.)
      - name: Set IDE_HOME
        run: echo "IDE_HOME=$RUNNER_TEMP/clion" >> "$GITHUB_ENV"

      # The IDE's bundled runtime may have no compiler; the scripts then use JAVA_HOME.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache CLion
        id: clion
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/clion
          key: clion-${{ env.CLION_VERSION }}

      - name: Download CLion
        if: steps.clion.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/clion.tar.gz" "https://download.jetbrains.com/cpp/CLion-$CLION_VERSION.tar.gz"
          echo "$CLION_SHA256  $RUNNER_TEMP/clion.tar.gz" | sha256sum -c -
          mkdir -p "$IDE_HOME"
          tar -xzf "$RUNNER_TEMP/clion.tar.gz" -C "$IDE_HOME" --strip-components=1
          rm "$RUNNER_TEMP/clion.tar.gz"

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: scripts/build-local.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ask-claude
          path: build/ask-claude.zip
          if-no-files-found: error

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/ask-claude.zip \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Latest build" \
            --notes "Built from $GITHUB_SHA on main. Install: Settings > Plugins > gear > Install Plugin from Disk... and choose ask-claude.zip."
